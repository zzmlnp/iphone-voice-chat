
      - name: Build iPhone app
        run: |
          cd ios_voice_mvp
          xcodebuild \
            -project "$(find . -maxdepth 1 -name '*.xcodeproj' -print -quit)" \
            -scheme VoiceChat \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build \
            CODE_SIGNING_ALLOWED=NO \
            build
