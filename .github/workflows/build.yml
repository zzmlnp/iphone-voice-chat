
name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd ios_voice_mvp
          xcodegen generate
          find . -maxdepth 1 -name '*.xcodeproj'

      - name: Build iPhone app
        run: |
          cd ios_voice_mvp
          PROJECT=$(find . -maxdepth 1 -name '*.xcodeproj' -print -quit)
          test -n "$PROJECT" || { echo "找不到 Xcode 项目"; exit 1; }
          xcodebuild \
            -project "$PROJECT" \
            -scheme VoiceChatTest \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/VoiceChat.app Payload/
          zip -r VoiceChat-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VoiceChat-unsigned-IPA
          path: VoiceChat-unsigned.ipa
